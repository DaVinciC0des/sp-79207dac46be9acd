<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study plan">
<title>Study plan</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #eceef2; --text: #141a21; --muted: #5d6876; --line: #e2e5ea;
  --accent: #3b5bdb; --on-accent: #ffffff; --danger: #c92a2a; --danger-bg: #fff1f1; --on-danger: #ffffff;
  --warn: #a85b00; --warn-bg: #fff5e6; --ok: #2b8a3e;
  --shadow: 0 1px 2px rgba(20, 26, 33, .05), 0 2px 8px rgba(20, 26, 33, .04);
  --radius: 14px;
  --course-0: #3b5bdb; --course-1: #d9480f; --course-2: #2b8a3e; --course-3: #9c36b5;
  --course-4: #0c8599; --course-5: #c2255c; --course-6: #b35c00; --course-7: #5f3dc4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --surface: #161b22; --surface-2: #212833; --text: #e6edf3; --muted: #8d96a0; --line: #2b323d;
    --accent: #7c95ff; --on-accent: #0d1117; --danger: #ff8a8a; --danger-bg: #2d1618; --on-danger: #1a0b0b;
    --warn: #f5b35c; --warn-bg: #2a2013; --ok: #5fd07a; --shadow: none;
    --course-0: #91a7ff; --course-1: #ffa94d; --course-2: #69db7c; --course-3: #da77f2;
    --course-4: #66d9e8; --course-5: #f783ac; --course-6: #ffd43b; --course-7: #b197fc;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 1140px; margin: 0 auto; padding: 0 20px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.pad { padding: 16px 18px; }

/* Header and navigation */
header.top {
  position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: saturate(1.5) blur(14px); backdrop-filter: saturate(1.5) blur(14px);
}
.top .wrap { display: flex; align-items: center; gap: 14px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; line-height: 1.2; }
.updated { font-size: 12px; color: var(--muted); white-space: nowrap; }
.updated.stale { color: var(--danger); font-weight: 600; }
.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
.tabs a { display: flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); }
.tabs a svg { width: 18px; height: 18px; }
.tabs a:hover { color: var(--text); }
.tabs a.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); flex: none; }
.icon-btn:hover { border-color: var(--muted); }

/* Course filter */
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 16px 0 2px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.fchip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.fchip.off { color: var(--muted); background: transparent; }
.fchip.off i { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.fchip.reset { color: var(--accent); border-style: dashed; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); white-space: nowrap; }
.badge { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 5px; background: var(--surface-2); color: var(--muted); }
.badge.exam { background: var(--danger-bg); color: var(--danger); }
.badge.lab { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.tag { font-size: 11px; font-weight: 700; color: var(--on-accent); background: var(--accent); padding: 1px 8px; border-radius: 99px; }
.tag.soft { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.alert { margin-top: 12px; background: var(--warn-bg); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.alert summary { cursor: pointer; font-weight: 600; }
.alert ul { margin: 8px 0 2px; padding-left: 20px; }

/* Shared view parts */
.view-head { display: flex; align-items: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.view-head .title { min-width: 0; }
.view-head h2 { margin: 0; font-size: 26px; letter-spacing: -.02em; line-height: 1.2; }
.head-stat { margin-left: auto; color: var(--muted); font-size: 14px; }
.head-stat b { color: var(--text); }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 26px 0 10px; font-weight: 700; }
.section-title span { background: var(--surface-2); border-radius: 99px; padding: 1px 8px; margin-left: 4px; }
.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 8px; }
.bar span { display: block; height: 100%; background: var(--ok); border-radius: inherit; }
.split { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin: 14px 0 10px; }
.split span { background: var(--c); }
.split span + span { border-left: 2px solid var(--surface); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; vertical-align: -1px; }
.empty { padding: 36px 24px; text-align: center; color: var(--muted); }
.empty-title { font-size: 18px; font-weight: 700; color: var(--text); }
.empty p { margin: 6px 0 16px; }

/* Day view */
.strip { display: flex; gap: 6px; overflow-x: auto; margin: 16px 0 0; padding-bottom: 4px; position: relative; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.sd { flex: 1 0 54px; display: flex; flex-direction: column; align-items: center; padding: 8px 0 7px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.sd:hover { border-color: var(--muted); }
.sd .dow { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; font-weight: 600; }
.sd .dom { font-size: 18px; font-weight: 700; line-height: 1.3; }
.sd.today .dom { color: var(--accent); }
.sd .dots { height: 6px; display: flex; gap: 3px; margin-top: 2px; }
.dot { width: 6px; height: 6px; border-radius: 50%; }
.dot.study { background: var(--accent); }
.dot.due { background: var(--danger); }
.sd.sel { background: var(--text); color: var(--bg); border-color: var(--text); }
.sd.sel .dow, .sd.sel .dom { color: inherit; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; margin-top: 18px; align-items: start; }
.aside { display: grid; gap: 14px; position: sticky; top: 84px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.stat { padding: 13px 15px; }
.stat .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.stat .v { font-size: 24px; font-weight: 750; letter-spacing: -.02em; line-height: 1.25; }
.stat .v .of { font-size: 15px; color: var(--muted); font-weight: 600; }
.stat .s { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.alert-stat .v { color: var(--danger); }
.due-item { display: flex; gap: 14px; align-items: center; padding: 12px 16px; border-radius: var(--radius); background: var(--danger-bg); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); margin-bottom: 12px; }
.due-item .when { font-weight: 800; font-size: 17px; color: var(--danger); font-variant-numeric: tabular-nums; }
.due-item .when::before { content: "Due "; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; display: block; line-height: 1; }
.due-title { font-weight: 650; margin-top: 3px; }
.due-title a, .dl h3 a { text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 30%, transparent); text-underline-offset: 3px; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.block { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border-left: 4px solid var(--c); }
.block .t { display: flex; flex-direction: column; line-height: 1.25; font-variant-numeric: tabular-nums; }
.block .t b { font-size: 16px; }
.block .t span { color: var(--muted); font-size: 13px; }
.block .name { font-weight: 650; font-size: 16px; margin-top: 4px; overflow-wrap: anywhere; }
.block .sub { font-size: 13px; color: var(--muted); }
.pomos { display: flex; gap: 4px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.pomos i { width: 11px; height: 11px; border-radius: 50%; background: color-mix(in srgb, var(--c) 28%, transparent); }
.pomos small { color: var(--muted); margin-left: 6px; font-size: 12px; }
.check { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: none; cursor: pointer; display: grid; place-items: center; color: transparent; }
.check svg { width: 18px; height: 18px; stroke-width: 3; }
.check:hover { border-color: var(--ok); color: color-mix(in srgb, var(--ok) 50%, transparent); }
.block.done .check { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.block.done .name { text-decoration: line-through; color: var(--muted); }
.block.done .pomos i { background: var(--ok); }
.block.past { opacity: .65; }
.block.now { box-shadow: 0 0 0 2px var(--accent); }
.gap { text-align: center; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 12px; }
.gap::before, .gap::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
.side-title { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
.mini { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.mini:first-of-type { border-top: 0; }
.mini:hover .tt { text-decoration: underline; }
.cd { font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.cd.urgent { color: var(--danger); }
.cd.soon { color: var(--warn); }
.mt { display: flex; gap: 7px; align-items: center; min-width: 0; font-size: 13.5px; }
.tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.big-num { font-size: 26px; font-weight: 750; letter-spacing: -.02em; }
.more { display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--accent); }
.more svg { width: 14px; height: 14px; }

/* Week view */
.week-summary { margin-top: 16px; }
.week-summary .split { margin-top: 0; }
.wg { margin-top: 14px; overflow: hidden; }
.wg-row { display: grid; grid-template-columns: 54px repeat(7, minmax(0, 1fr)); }
.wg-top { border-bottom: 1px solid var(--line); }
.wg-dh { padding: 10px 4px 8px; text-align: center; border-left: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; }
.wg-dh:hover { background: var(--surface-2); }
.wg-dh .dow { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; font-weight: 600; }
.wg-dh .dom { font-size: 19px; font-weight: 700; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; }
.wg-dh.today .dom { background: var(--accent); color: var(--on-accent); }
.wg-dh small { color: var(--muted); font-size: 12px; }
.wg-body { padding: 10px 0; }
.wg-hours, .wg-col { position: relative; height: calc(var(--rows) * var(--px)); }
.wg-hours span { position: absolute; right: 8px; font-size: 11px; color: var(--muted); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.wg-col { border-left: 1px solid var(--line); background-image: linear-gradient(color-mix(in srgb, var(--line) 70%, transparent) 1px, transparent 1px); background-size: 100% var(--px); }
.wg-col.today { background-color: color-mix(in srgb, var(--accent) 5%, transparent); }
.wg-block { position: absolute; left: 3px; right: 3px; border-radius: 7px; padding: 3px 6px; font-size: 11.5px; line-height: 1.25; overflow: hidden; background: color-mix(in srgb, var(--c) 15%, var(--surface)); border-left: 3px solid var(--c);
  -webkit-mask-image: linear-gradient(#000 calc(100% - 8px), transparent); mask-image: linear-gradient(#000 calc(100% - 8px), transparent); }
.wg-block:hover { background: color-mix(in srgb, var(--c) 25%, var(--surface)); }
.wg-block b { display: block; font-size: 11px; color: var(--c); }
.wg-block.done { opacity: .5; }
.wg-due { position: absolute; left: 0; right: 0; border-top: 2px solid var(--danger); z-index: 2; }
.wg-due span { position: absolute; top: -9px; right: 3px; max-width: calc(100% - 6px); background: var(--danger); color: var(--on-danger); font-size: 10.5px; font-weight: 700; border-radius: 5px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wg-now { position: absolute; left: 0; right: 0; border-top: 2px solid var(--accent); z-index: 3; pointer-events: none; }
.wg-now::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.week-list { display: none; }
.wl-day { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 12px; padding: 12px 14px; align-items: center; }
.wl-date { text-align: center; display: flex; flex-direction: column; }
.wl-date .dow { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; font-weight: 600; }
.wl-date .dom { font-size: 20px; font-weight: 700; line-height: 1.2; }
.wl-day.today .dom { color: var(--accent); }
.wl-items { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.wl-item { display: flex; gap: 8px; align-items: center; font-size: 13.5px; min-width: 0; }
.wl-item.due .txt { color: var(--danger); font-weight: 650; }
.wl-empty { color: var(--muted); font-size: 13px; }

/* Deadlines view */
.seg { display: inline-flex; background: var(--surface-2); padding: 4px; border-radius: 11px; gap: 2px; margin-top: 16px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 13px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.dl-list { display: grid; gap: 12px; }
.dl { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; padding: 16px 20px; border-left: 4px solid var(--c); }
.dl .when { display: flex; flex-direction: column; }
.dl .when .big { font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.dl .when small { color: var(--muted); font-size: 12.5px; margin-top: 5px; }
.dl.urgent .when .big { color: var(--danger); }
.dl.soon .when .big { color: var(--warn); }
.dl h3 { margin: 6px 0 4px; font-size: 16.5px; line-height: 1.35; overflow-wrap: anywhere; }
.warn-line { color: var(--warn); font-size: 13px; margin-top: 6px; font-weight: 600; }
.dl details { margin-top: 10px; font-size: 13px; }
.dl summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.sessions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sessions a { padding: 4px 9px; border-radius: 8px; background: var(--surface-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.sessions a:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.sessions a.done { text-decoration: line-through; opacity: .6; }

/* Courses view */
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-top: 18px; }
.course { padding: 18px 20px; border-top: 4px solid var(--c); }
.course.off { opacity: .55; }
.course-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.link { border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; }
.course h3 { margin: 8px 0 0; font-size: 17px; line-height: 1.3; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 4px; }
.kpi .v { font-size: 19px; font-weight: 750; letter-spacing: -.01em; }
.kpi .k { font-size: 12px; color: var(--muted); }
.sub-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 18px 0 6px; font-weight: 700; }
.weeks { display: flex; gap: 5px; }
.wk { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.wk-bar { height: 48px; width: 100%; display: flex; align-items: flex-end; }
.wk-bar span { width: 100%; border-radius: 4px 4px 2px 2px; background: var(--c); min-height: 3px; }
.wk-bar span.zero { background: var(--surface-2); }
.wk small { font-size: 10px; color: var(--muted); }
.course ul { list-style: none; padding: 0; margin: 12px 0 0; }
.course li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.course li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.course li span:last-child { white-space: nowrap; }

.foot { color: var(--muted); font-size: 12.5px; padding-top: 36px; padding-bottom: 36px; display: flex; gap: 6px 18px; flex-wrap: wrap; }
kbd { font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 2px 5px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); }

@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .aside { position: static; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
}
@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  .top .wrap { height: 58px; }
  header.top { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--bg); }
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; border-radius: 0; justify-content: space-around;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line);
  }
  .tabs a { flex-direction: column; gap: 2px; font-size: 11px; padding: 5px 10px; flex: 1; }
  .tabs a svg { width: 22px; height: 22px; }
  .tabs a.active { box-shadow: none; background: none; color: var(--accent); }
  body { padding-bottom: 76px; }
  .sub-label { display: none; }
  .view-head h2 { font-size: 21px; }
  .view-head .title { flex: 1; }
  .head-stat { margin-left: 0; width: 100%; }
  .stats { gap: 8px; }
  .stat { padding: 10px 12px; }
  .stat .v { font-size: 20px; }
  .block { grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; padding: 12px 12px; }
  .block .name { font-size: 15px; }
  .wg { display: none; }
  .week-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .dl { grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 14px 16px; }
  .dl .when { flex-direction: row; align-items: baseline; gap: 10px; }
  .dl .when .big { font-size: 20px; }
  .foot .keys { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">

<script>
(() => {
  'use strict';

  const DATA = JSON.parse(document.getElementById('plan-data').textContent);
  const DAY_MS = 864e5;
  const POMO = DATA.pomodoro;
  const TYPE_LABEL = {deadline: 'Deadline', lab: 'Lab', exam: 'Exam', lecture: 'Lecture'};
  const ICON = {
    prev: '<svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>',
    next: '<svg viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg>',
    check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  };

  DATA.courses.forEach((c, i) => { c.color = `var(--course-${i % 8})`; });
  const COURSE = Object.fromEntries(DATA.courses.map(c => [c.code, c]));
  DATA.events.forEach(e => { e.date = new Date(e.due); });
  DATA.blocks.forEach(b => { b.startDate = new Date(b.start); b.endDate = new Date(b.end); });
  DATA.events.sort((a, b) => a.date - b.date);
  DATA.blocks.sort((a, b) => a.startDate - b.startDate);
  const EVENT = Object.fromEntries(DATA.events.map(e => [e.id, e]));
  const BLOCK_IDS = new Set(DATA.blocks.map(b => b.id));

  // Per-browser state. Storage can be unavailable (private mode), so every access is guarded.
  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(`studyplan.${key}`); return v ? JSON.parse(v) : fallback; }
      catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(`studyplan.${key}`, JSON.stringify(value)); } catch (e) { /* ignore */ }
    },
  };
  const hidden = new Set(store.get('hidden', []));
  const done = new Set(store.get('done', []).filter(id => BLOCK_IDS.has(id)));
  store.set('done', [...done]);
  let typeFilter = 'all';
  let lastView = null;

  // ---- Helpers ----
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const isYmd = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
  const fromYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const monday = d => addDays(startOfDay(d), -((d.getDay() + 6) % 7));
  const hourOf = d => d.getHours() + d.getMinutes() / 60;
  const time = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const fmt = (d, opts) => d.toLocaleDateString('en-GB', opts);
  const shortDate = d => fmt(d, {weekday: 'short', day: 'numeric', month: 'short'});
  const dayDiff = (a, b) => Math.round((startOfDay(a) - startOfDay(b)) / DAY_MS);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const fmtH = mins => `${Math.round(mins / 6) / 10} h`;
  const dur = mins => mins < 60 ? `${mins} min` : `${Math.floor(mins / 60)} h${mins % 60 ? ` ${mins % 60} min` : ''}`;

  function isoWeek(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / DAY_MS + 1) / 7);
  }
  function rel(d, now = new Date()) {
    const n = dayDiff(d, now);
    if (n === 0) return 'today';
    if (n === 1) return 'tomorrow';
    if (n === -1) return 'yesterday';
    return n > 0 ? `in ${n} days` : `${-n} days ago`;
  }
  function countdown(d, now = new Date()) {
    const ms = d - now;
    if (ms <= 0) return 'Passed';
    if (ms < 36e5) return `${Math.max(1, Math.round(ms / 6e4))} min`;
    if (ms < DAY_MS) return `${Math.floor(ms / 36e5)} h`;
    return plural(Math.max(1, dayDiff(d, now)), 'day');
  }
  function dateRange(a, b) {
    const f = d => fmt(d, {day: 'numeric', month: 'short'});
    return ymd(a) === ymd(b) ? f(a) : `${f(a)} &ndash; ${f(b)}`;
  }
  function urgency(e) {
    const days = (e.date - new Date()) / DAY_MS;
    return days <= 2 ? 'urgent' : days <= 7 ? 'soon' : '';
  }

  const visibleBlocks = () => DATA.blocks.filter(b => !hidden.has(b.course));
  const visibleEvents = () => DATA.events.filter(e => !hidden.has(e.course));
  const sameDay = (items, key, field) => items.filter(x => ymd(x[field]) === key);
  const pomos = blocks => blocks.reduce((s, b) => s + b.pomodoros, 0);
  const donePomos = blocks => pomos(blocks.filter(b => done.has(b.id)));
  const colorOf = code => (COURSE[code] || {}).color || 'var(--muted)';
  const chip = code => `<span class="chip" style="--c:${colorOf(code)}">${esc(code)}</span>`;
  const badge = type => `<span class="badge ${esc(type)}">${esc(TYPE_LABEL[type] || type)}</span>`;
  const eventTitle = e => e.url
    ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>`
    : esc(e.title);

  function splitBar(blocks) {
    const per = {};
    blocks.forEach(b => { per[b.course] = (per[b.course] || 0) + b.pomodoros * POMO; });
    const total = Object.values(per).reduce((a, b) => a + b, 0);
    if (!total) return '<p class="muted small">No study planned.</p>';
    const codes = DATA.courses.map(c => c.code).filter(c => per[c]);
    return `<div class="split">${codes.map(c => `<span style="--c:${colorOf(c)};width:${per[c] / total * 100}%" title="${esc(c)}: ${fmtH(per[c])}"></span>`).join('')}</div>`
      + `<div class="legend">${codes.map(c => `<span><i style="--c:${colorOf(c)}"></i>${esc(c)} ${fmtH(per[c])}</span>`).join('')}</div>`;
  }

  // ---- Day view ----
  function viewDay(key) {
    const now = new Date(), today = startOfDay(now), todayKey = ymd(now), day = fromYmd(key);
    const blocks = sameDay(visibleBlocks(), key, 'startDate');
    const due = sameDay(visibleEvents(), key, 'date');
    const total = pomos(blocks), fin = donePomos(blocks);

    const offset = dayDiff(day, today);
    const stripStart = offset >= 0 && offset < 14 ? today : addDays(day, -3);
    let strip = '';
    for (let i = 0; i < 14; i++) {
      const d = addDays(stripStart, i), k = ymd(d);
      const study = sameDay(visibleBlocks(), k, 'startDate').length > 0;
      const dueHere = sameDay(visibleEvents(), k, 'date').length > 0;
      strip += `<a class="sd${k === key ? ' sel' : ''}${k === todayKey ? ' today' : ''}" href="#day/${k}" aria-label="${fmt(d, {weekday: 'long', day: 'numeric', month: 'long'})}">`
        + `<span class="dow">${fmt(d, {weekday: 'short'})}</span><span class="dom">${d.getDate()}</span>`
        + `<span class="dots">${study ? '<i class="dot study"></i>' : ''}${dueHere ? '<i class="dot due"></i>' : ''}</span></a>`;
    }

    const head = `<div class="view-head">
        <a class="icon-btn" href="#day/${ymd(addDays(day, -1))}" aria-label="Previous day">${ICON.prev}</a>
        <div class="title"><h2>${fmt(day, {weekday: 'long', day: 'numeric', month: 'long'})}</h2>
          <div class="muted">${cap(rel(day, now))} &middot; week ${isoWeek(day)}</div></div>
        <a class="icon-btn" href="#day/${ymd(addDays(day, 1))}" aria-label="Next day">${ICON.next}</a>
        ${key === todayKey ? '' : '<a class="btn" href="#day">Today</a>'}
      </div>
      <nav class="strip" aria-label="Days">${strip}</nav>`;

    const stats = `<div class="stats">
        <div class="card stat"><div class="k">Study time</div><div class="v">${fmtH(total * POMO)}</div><div class="s">${plural(blocks.length, 'session')}</div></div>
        <div class="card stat"><div class="k">Pomodoros done</div><div class="v">${fin}<span class="of"> / ${total}</span></div><div class="bar"><span style="width:${total ? fin / total * 100 : 0}%"></span></div></div>
        <div class="card stat${due.length ? ' alert-stat' : ''}"><div class="k">Due this day</div><div class="v">${due.length}</div><div class="s">${due.length ? due.map(e => esc(e.course)).join(', ') : 'Nothing due'}</div></div>
      </div>`;

    const dueHtml = due.map(e => `<div class="due-item">
        <div class="when">${time(e.date)}</div>
        <div><div class="meta">${chip(e.course)}${badge(e.type)}</div><div class="due-title">${eventTitle(e)}</div></div>
      </div>`).join('');

    const isToday = key === todayKey;
    const current = isToday ? blocks.find(b => b.startDate <= now && now < b.endDate) : null;
    const upNext = isToday && !current ? blocks.find(b => b.startDate > now) : null;
    let items = '', prev = null;
    for (const b of blocks) {
      if (prev) {
        const gap = Math.round((b.startDate - prev.endDate) / 6e4);
        if (gap >= 30) {
          const lunch = hourOf(prev.endDate) <= 12.5 && hourOf(b.startDate) >= 12.5;
          items += `<li class="gap"><span>${lunch ? 'Lunch' : 'Break'} &middot; ${dur(gap)}</span></li>`;
        }
      }
      prev = b;
      const ev = EVENT[b.event], isDone = done.has(b.id);
      const tag = b === current ? '<span class="tag">Now</span>' : b === upNext ? '<span class="tag soft">Up next</span>' : '';
      const cls = ['card', 'block', isDone && 'done', b === current && 'now', !isDone && b.endDate < now && 'past'].filter(Boolean).join(' ');
      items += `<li class="${cls}" style="--c:${colorOf(b.course)}">
          <div class="t"><b>${time(b.startDate)}</b><span>${time(b.endDate)}</span></div>
          <div>
            <div class="meta">${chip(b.course)}${tag}</div>
            <div class="name">${ev ? esc(ev.title) : ''}</div>
            <div class="sub">${ev ? `${TYPE_LABEL[ev.type] || ev.type} due ${shortDate(ev.date)} ${time(ev.date)} &middot; ${rel(ev.date, now)}` : ''}</div>
            <div class="pomos" aria-label="${plural(b.pomodoros, 'pomodoro')}">${'<i></i>'.repeat(b.pomodoros)}<small>${b.pomodoros} &times; ${POMO} min</small></div>
          </div>
          <button class="check" data-done="${b.id}" aria-pressed="${isDone}" title="${isDone ? 'Mark as not done' : 'Mark as done'}">${ICON.check}</button>
        </li>`;
    }

    let body;
    if (blocks.length) {
      body = `<ol class="timeline">${items}</ol>`;
    } else {
      const next = visibleBlocks().find(b => b.startDate >= addDays(day, 1));
      const past = day < today;
      body = `<div class="card empty"><div class="empty-title">${past ? 'In the past' : 'Free day'}</div>`
        + `<p>${past ? 'Past study sessions are not kept in the plan.' : 'No study sessions are scheduled for this day.'}</p>`
        + (next ? `<a class="btn primary" href="#day/${ymd(next.startDate)}">Next study day: ${shortDate(next.startDate)} ${ICON.next}</a>` : '')
        + '</div>';
    }

    const upcoming = visibleEvents().filter(e => e.date > now).slice(0, 5);
    const wk = monday(day);
    const wkBlocks = visibleBlocks().filter(b => b.startDate >= wk && b.startDate < addDays(wk, 7));
    const aside = `<aside class="aside">
        <section class="card pad">
          <h3 class="side-title">Next deadlines</h3>
          ${upcoming.map(e => `<a class="mini" href="#deadlines"><span class="cd ${urgency(e)}">${countdown(e.date, now)}</span><span class="mt">${chip(e.course)}<span class="tt">${esc(e.title)}</span></span></a>`).join('') || '<p class="muted small">Nothing upcoming.</p>'}
          <a class="more" href="#deadlines">All deadlines ${ICON.next}</a>
        </section>
        <section class="card pad">
          <h3 class="side-title">Week ${isoWeek(day)}</h3>
          <div class="big-num">${fmtH(pomos(wkBlocks) * POMO)}</div><div class="muted small">planned study time</div>
          ${splitBar(wkBlocks)}
          <a class="more" href="#week/${ymd(wk)}">Open week ${ICON.next}</a>
        </section>
      </aside>`;

    return `${head}<div class="layout"><div>${stats}${dueHtml}${body}</div>${aside}</div>`;
  }

  // ---- Week view ----
  function viewWeek(arg) {
    const now = new Date(), todayKey = ymd(now);
    const start = monday(isYmd(arg) ? fromYmd(arg) : now), end = addDays(start, 7);
    const days = Array.from({length: 7}, (_, i) => addDays(start, i));
    const blocks = visibleBlocks().filter(b => b.startDate >= start && b.startDate < end);
    const events = visibleEvents().filter(e => e.date >= start && e.date < end);

    let minH = 8, maxH = 18;
    blocks.forEach(b => { minH = Math.min(minH, b.startDate.getHours()); maxH = Math.max(maxH, Math.ceil(hourOf(b.endDate))); });
    events.forEach(e => { minH = Math.min(minH, e.date.getHours()); maxH = Math.max(maxH, Math.min(24, e.date.getHours() + 1)); });
    const PX = 46, y = d => (hourOf(d) - minH) * PX;

    const head = `<div class="view-head">
        <a class="icon-btn" href="#week/${ymd(addDays(start, -7))}" aria-label="Previous week">${ICON.prev}</a>
        <div class="title"><h2>Week ${isoWeek(start)}</h2>
          <div class="muted">${fmt(start, {day: 'numeric', month: 'short'})} &ndash; ${fmt(addDays(start, 6), {day: 'numeric', month: 'short', year: 'numeric'})}</div></div>
        <a class="icon-btn" href="#week/${ymd(end)}" aria-label="Next week">${ICON.next}</a>
        ${ymd(start) === ymd(monday(now)) ? '' : '<a class="btn" href="#week">This week</a>'}
        <div class="head-stat"><b>${fmtH(pomos(blocks) * POMO)}</b> study &middot; <b>${events.length}</b> ${events.length === 1 ? 'deadline' : 'deadlines'}</div>
      </div>
      <div class="card pad week-summary">${splitBar(blocks)}</div>`;

    const heads = days.map(d => {
      const k = ymd(d), mins = pomos(blocks.filter(b => ymd(b.startDate) === k)) * POMO;
      return `<a class="wg-dh${k === todayKey ? ' today' : ''}" href="#day/${k}"><span class="dow">${fmt(d, {weekday: 'short'})}</span><span class="dom">${d.getDate()}</span><small>${mins ? fmtH(mins) : '&ndash;'}</small></a>`;
    }).join('');
    const hourLabels = Array.from({length: maxH - minH + 1}, (_, i) => `<span style="top:${i * PX}px">${pad(minH + i)}:00</span>`).join('');
    const cols = days.map(d => {
      const k = ymd(d);
      let html = blocks.filter(b => ymd(b.startDate) === k).map(b => {
        const ev = EVENT[b.event], title = ev ? ev.title : '';
        const h = Math.max(20, y(b.endDate) - y(b.startDate) - 2);
        return `<a class="wg-block${done.has(b.id) ? ' done' : ''}" href="#day/${k}" style="--c:${colorOf(b.course)};top:${y(b.startDate)}px;height:${h}px" title="${esc(`${time(b.startDate)}–${time(b.endDate)} ${b.course}: ${title}`)}"><b>${esc(b.course)} &middot; ${time(b.startDate)}</b>${esc(title)}</a>`;
      }).join('');
      html += events.filter(e => ymd(e.date) === k).map(e =>
        `<a class="wg-due" href="#deadlines" style="top:${y(e.date)}px" title="${esc(`Due ${time(e.date)}: ${e.course} ${e.title}`)}"><span>${time(e.date)} ${esc(e.course)} due</span></a>`).join('');
      if (k === todayKey && hourOf(now) >= minH && hourOf(now) <= maxH) html += `<div class="wg-now" style="top:${y(now)}px"></div>`;
      return `<div class="wg-col${k === todayKey ? ' today' : ''}">${html}</div>`;
    }).join('');
    const grid = `<div class="card wg" style="--px:${PX}px;--rows:${maxH - minH}">
        <div class="wg-row wg-top"><div></div>${heads}</div>
        <div class="wg-row wg-body"><div class="wg-hours">${hourLabels}</div>${cols}</div>
      </div>`;

    const list = days.map(d => {
      const k = ymd(d), perEvent = new Map();
      blocks.filter(b => ymd(b.startDate) === k).forEach(b => {
        const x = perEvent.get(b.event) || {b, n: 0};
        x.n += b.pomodoros;
        perEvent.set(b.event, x);
      });
      const items = [
        ...events.filter(e => ymd(e.date) === k).map(e => `<div class="wl-item due">${chip(e.course)}<span class="tt txt">Due ${time(e.date)} &middot; ${esc(e.title)}</span></div>`),
        ...[...perEvent.values()].map(({b, n}) => `<div class="wl-item">${chip(b.course)}<span class="tt">${fmtH(n * POMO)} &middot; ${esc((EVENT[b.event] || {}).title || '')}</span></div>`),
      ].join('');
      return `<a class="card wl-day${k === todayKey ? ' today' : ''}" href="#day/${k}"><div class="wl-date"><span class="dow">${fmt(d, {weekday: 'short'})}</span><span class="dom">${d.getDate()}</span></div><div class="wl-items">${items || '<span class="wl-empty">Free</span>'}</div></a>`;
    }).join('');

    return `${head}${grid}<div class="week-list">${list}</div>`;
  }

  // ---- Deadlines view ----
  function deadlineCard(e) {
    const now = new Date();
    const bs = DATA.blocks.filter(b => b.event === e.id);
    const total = pomos(bs), fin = donePomos(bs), plannedMin = total * POMO;
    const missing = e.hours - plannedMin / 60;
    const sessions = bs.length
      ? `<details><summary>${plural(bs.length, 'study session')} &middot; ${dateRange(bs[0].startDate, bs[bs.length - 1].startDate)}</summary>
          <div class="sessions">${bs.map(b => `<a class="${done.has(b.id) ? 'done' : ''}" href="#day/${ymd(b.startDate)}">${shortDate(b.startDate)} ${time(b.startDate)}&ndash;${time(b.endDate)}</a>`).join('')}</div></details>`
      : '';
    return `<article class="card dl ${urgency(e)}" style="--c:${colorOf(e.course)}">
        <div class="when"><span class="big">${countdown(e.date, now)}</span><small>${shortDate(e.date)} &middot; ${time(e.date)}</small></div>
        <div>
          <div class="meta">${chip(e.course)}${badge(e.type)}</div>
          <h3>${eventTitle(e)}</h3>
          <div class="bar"><span style="width:${total ? fin / total * 100 : 0}%"></span></div>
          <div class="muted small" style="margin-top:6px">${fin} / ${total} pomodoros done &middot; ${fmtH(plannedMin)} planned of ${e.hours} h estimated</div>
          ${missing > 0.05 ? `<div class="warn-line">&#9888; ${missing.toFixed(1)} h does not fit before the deadline</div>` : ''}
          ${sessions}
        </div>
      </article>`;
  }

  function viewDeadlines() {
    const now = new Date();
    const types = [...new Set(DATA.events.map(e => e.type))];
    const seg = `<div class="seg">${['all', ...types].map(t =>
      `<button data-type="${esc(t)}" class="${typeFilter === t ? 'active' : ''}">${t === 'all' ? 'All' : esc(TYPE_LABEL[t] || t) + 's'}</button>`).join('')}</div>`;
    const list = visibleEvents().filter(e => e.date > now && (typeFilter === 'all' || e.type === typeFilter));
    const groups = [['Next 7 days', 7], ['Next 30 days', 30], ['Later', Infinity]];
    let html = '', from = 0;
    for (const [label, until] of groups) {
      const g = list.filter(e => { const d = (e.date - now) / DAY_MS; return d >= from && d < until; });
      from = until;
      if (g.length) html += `<h3 class="section-title">${label} <span>${g.length}</span></h3><div class="dl-list">${g.map(deadlineCard).join('')}</div>`;
    }
    return `<div class="view-head"><div class="title"><h2>Deadlines</h2><div class="muted">${plural(list.length, 'upcoming item')}</div></div></div>`
      + seg + (html || '<div class="card empty" style="margin-top:16px"><div class="empty-title">All clear</div><p>No upcoming deadlines.</p></div>');
  }

  // ---- Courses view ----
  function viewCourses() {
    const now = new Date(), wk0 = monday(now);
    const last = DATA.blocks.length ? DATA.blocks[DATA.blocks.length - 1].startDate : now;
    const count = Math.min(16, Math.max(8, Math.floor(dayDiff(monday(last), wk0) / 7) + 1));
    const weeks = Array.from({length: count}, (_, i) => addDays(wk0, i * 7));
    const all = DATA.courses.map(c => ({
      c,
      perWeek: weeks.map(w => pomos(DATA.blocks.filter(b => b.course === c.code && b.startDate >= w && b.startDate < addDays(w, 7))) * POMO),
    }));
    const max = Math.max(1, ...all.flatMap(x => x.perWeek));
    const cards = all.map(({c, perWeek}) => {
      const evs = DATA.events.filter(e => e.course === c.code && e.date > now);
      const bs = DATA.blocks.filter(b => b.course === c.code);
      const total = pomos(bs), fin = donePomos(bs), off = hidden.has(c.code);
      return `<article class="card course${off ? ' off' : ''}" style="--c:${c.color}">
          <div class="course-top">${chip(c.code)}<button class="link" data-course="${esc(c.code)}">${off ? 'Show in plan' : 'Hide from plan'}</button></div>
          <h3>${esc(c.name)}</h3>
          <div class="kpis">
            <div class="kpi"><div class="v">${fmtH(total * POMO)}</div><div class="k">planned</div></div>
            <div class="kpi"><div class="v">${evs.length}</div><div class="k">${evs.length === 1 ? 'deadline' : 'deadlines'}</div></div>
            <div class="kpi"><div class="v">${evs.length ? countdown(evs[0].date, now) : '&ndash;'}</div><div class="k">to next</div></div>
          </div>
          <div class="bar"><span style="width:${total ? fin / total * 100 : 0}%"></span></div>
          <div class="muted small" style="margin-top:6px">${fin} / ${total} pomodoros done</div>
          <div class="sub-title">Study hours per week</div>
          <div class="weeks">${perWeek.map((m, i) => `<div class="wk" title="Week ${isoWeek(weeks[i])}: ${fmtH(m)}"><div class="wk-bar"><span class="${m ? '' : 'zero'}" style="height:${m / max * 100}%"></span></div><small>w${isoWeek(weeks[i])}</small></div>`).join('')}</div>
          <ul>${evs.map(e => `<li><span>${esc(e.title)}</span><span class="muted">${fmt(e.date, {day: 'numeric', month: 'short'})}</span></li>`).join('') || '<li class="muted">No upcoming deadlines</li>'}</ul>
        </article>`;
    }).join('');
    return `<div class="view-head"><div class="title"><h2>Courses</h2><div class="muted">${plural(DATA.courses.length, 'course')} in the plan</div></div></div><div class="course-grid">${cards}</div>`;
  }

  // ---- App shell ----
  const VIEWS = {
    day: arg => viewDay(isYmd(arg) ? arg : ymd(new Date())),
    week: viewWeek,
    deadlines: viewDeadlines,
    courses: viewCourses,
  };

  function currentRoute() {
    const [view, arg] = location.hash.replace(/^#/, '').split('/');
    return {view: VIEWS[view] ? view : 'day', arg};
  }

  function renderChrome() {
    const gen = new Date(DATA.generated), ageH = (new Date() - gen) / 36e5;
    const updated = document.getElementById('updated');
    updated.textContent = `Updated ${shortDate(gen)} ${time(gen)}${ageH > 36 ? ' · may be outdated' : ''}`;
    updated.classList.toggle('stale', ageH > 36);

    document.getElementById('filters').innerHTML = DATA.courses.map(c =>
      `<button class="fchip${hidden.has(c.code) ? ' off' : ''}" data-course="${esc(c.code)}" style="--c:${c.color}" title="${esc(c.name)}" aria-pressed="${!hidden.has(c.code)}"><i></i>${esc(c.code)}</button>`).join('')
      + (hidden.size ? '<button class="fchip reset" data-show-all>Show all</button>' : '');

    const w = DATA.warnings;
    document.getElementById('warnings').innerHTML = w.length
      ? `<details class="alert"><summary>&#9888; ${plural(w.length, 'warning')}</summary><ul>${w.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>`
      : '';
  }

  function render() {
    const {view, arg} = currentRoute();
    document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('active', a.dataset.view === view));
    renderChrome();
    document.getElementById('view').innerHTML = VIEWS[view](arg);
    if (view !== lastView) window.scrollTo(0, 0);
    lastView = view;
    const strip = document.querySelector('.strip'), sel = strip && strip.querySelector('.sel');
    if (sel) strip.scrollLeft = sel.offsetLeft - strip.clientWidth / 2 + sel.clientWidth / 2;
  }

  function step(n) {
    const {view, arg} = currentRoute();
    const base = isYmd(arg) ? fromYmd(arg) : new Date();
    if (view === 'day') location.hash = `#day/${ymd(addDays(base, n))}`;
    if (view === 'week') location.hash = `#week/${ymd(addDays(monday(base), 7 * n))}`;
  }

  document.addEventListener('click', ev => {
    const t = ev.target.closest('[data-done], [data-course], [data-type], [data-show-all]');
    if (!t) return;
    ev.preventDefault();
    const d = t.dataset;
    const toggle = (set, id, key) => { set.has(id) ? set.delete(id) : set.add(id); store.set(key, [...set]); };
    if (d.done) toggle(done, d.done, 'done');
    else if (d.course) toggle(hidden, d.course, 'hidden');
    else if (d.type) typeFilter = d.type;
    else { hidden.clear(); store.set('hidden', []); }
    render();
  });

  document.addEventListener('keydown', ev => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey || /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
    if (ev.key === 'ArrowLeft') step(-1);
    else if (ev.key === 'ArrowRight') step(1);
    else if (ev.key === 't' || ev.key === 'T') location.hash = currentRoute().view === 'week' ? '#week' : '#day';
  });

  // Swipe left/right on phones to move between days or weeks.
  let touch = null;
  const viewEl = document.getElementById('view');
  viewEl.addEventListener('touchstart', e => { touch = {x: e.touches[0].clientX, y: e.touches[0].clientY}; }, {passive: true});
  viewEl.addEventListener('touchend', e => {
    if (!touch || e.target.closest('.strip')) { touch = null; return; }
    const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
    touch = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) step(dx < 0 ? 1 : -1);
  });

  // webcal:// makes phones offer "Subscribe" instead of a one-off import.
  if (location.protocol === 'https:') {
    document.getElementById('subscribe').href = `webcal://${location.host}${location.pathname.replace(/[^/]*$/, '')}study-plan.ics`;
  }

  window.addEventListener('hashchange', render);
  setInterval(() => { if (['day', 'week'].includes(currentRoute().view)) render(); }, 60000);
  render();
})();
</script>
</body>
</html>
